backend:
  name: github
  repo: MintyOsinty/mintyosinty.github.io
  branch: main
  base_url: https://sveltia-cms-auth.mintyosinty.workers.dev

media_folder: "images"
public_folder: "/images"

collections:
  # Blog + vlog posts. Each post is one Markdown file in _posts/.
  # Jekyll wraps it in _layouts/post.html automatically.
  - name: "posts"
    label: "Field Notes (Posts)"
    label_singular: "Post"
    folder: "_posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Short description", name: "description", widget: "text", required: false, hint: "1–2 sentences. Shows on the blog list and in search results." }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Comma-separated, e.g. github, beginner" }
      - { label: "Difficulty", name: "level", widget: "select", options: ["Beginner", "Intermediate", "Advanced"], default: "Beginner", required: false }
      - { label: "YouTube link (vlogs only)", name: "video", widget: "string", required: false, hint: "Paste a YouTube URL to embed it at the top of the post. Leave blank for a normal blog post." }
      - { label: "Body", name: "body", widget: "markdown" }

  -name: "tools"
    label: "Tools Arsenal"
    editor: { preview: false }
    files:
      - name: "tools"
        label: "Tools List"
        file: "_data/tools.yml"
        format: "yaml"
        fields:
          - label: "Tools"
            name: "tools"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { label: "Tool name", name: "name", widget: "string" }
              - { label: "Download URL", name: "url", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Icon (emoji)", name: "icon", widget: "string", default: "🛠️", required: false }
              - { label: "Card color", name: "color", widget: "select", options: ["cyan", "yellow", "magenta", "green", "red"], default: "cyan" }
              - { label: "Difficulty (1-10)", name: "level", widget: "number", value_type: "int", min: 1, max: 10, default: 3 }
              - { label: "Platform", name: "platform", widget: "string", required: false }
              - { label: "Short description", name: "description", widget: "text" }
  # The homepage is intentionally NOT in the CMS any more.
  # Edit index.html directly on GitHub so the CMS can never blank it again.
