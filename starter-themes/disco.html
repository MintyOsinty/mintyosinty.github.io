<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --night:  #1a0b2e;
      --purple: #6a1fb0;
      --pink:   #ff3cac;
      --gold:   #ffc93c;
      --silver: #e8e6f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: var(--silver);
      background: radial-gradient(ellipse at top, var(--purple), var(--night) 70%);
      min-height: 100vh;
    }

    header { text-align: center; padding: 2.5rem 1rem 1rem; }

    /* Mirror ball: a circle covered in a grid of "mirror tiles" */
    .ball {
      width: 120px; height: 120px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0 2px, transparent 2px 12px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.25) 0 2px, transparent 2px 12px),
        radial-gradient(circle at 35% 30%, #ffffff, #b9b6c9 45%, #5b5670 100%);
      box-shadow: 0 0 40px rgba(255, 201, 60, 0.5), 0 0 90px rgba(255, 60, 172, 0.35);
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { background-position: 0 0, 120px 0, 0 0; } }  /* slides the vertical tile lines so the ball looks like it's turning */

    /* Sparkles that twinkle around the page */
    .sparkle { position: fixed; color: var(--gold); animation: twinkle 2s ease-in-out infinite; pointer-events: none; }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.2); } }

    h1 {
      font-family: 'Monoton', cursive;
      font-weight: normal;
      font-size: clamp(2.4rem, 9vw, 4.5rem);
      color: var(--gold);
      text-shadow: 0 0 12px var(--pink), 0 0 30px var(--pink);
      letter-spacing: 0.05em;
    }
    .tagline { margin-top: 0.75rem; color: var(--pink); font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; }

    main { max-width: 640px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; text-align: center; }
    h2 { color: var(--gold); margin: 1.5rem 0 0.5rem; font-size: 1.4rem; }

    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: 1rem; }
    .links a {
      text-decoration: none;
      color: var(--night);
      font-weight: 600;
      padding: 0.75rem 1.6rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), #fff3c4, var(--gold));
      box-shadow: 0 0 18px rgba(255, 201, 60, 0.6);
    }
    .links a:hover { background: linear-gradient(135deg, var(--pink), #ffd1ec, var(--pink)); box-shadow: 0 0 22px var(--pink); }

    /* Light-up dance floor */
    .floor { display: grid; grid-template-columns: repeat(8, 1fr); height: 90px; margin-top: 1rem; }
    .floor span { animation: glow 1.6s infinite; }
    .floor span:nth-child(3n)   { animation-delay: 0.4s; }
    .floor span:nth-child(4n+1) { animation-delay: 0.8s; }
    .floor span:nth-child(5n+2) { animation-delay: 1.2s; }
    @keyframes glow {
      0%   { background: var(--pink); }
      33%  { background: var(--gold); }
      66%  { background: var(--purple); }
      100% { background: var(--pink); }
    }
    footer { text-align: center; padding: 1rem; background: #000; color: var(--gold); font-weight: 600; letter-spacing: 0.15em; }
  </style>
</head>
<body>
  <span class="sparkle" style="top:12%;left:10%">✦</span>
  <span class="sparkle" style="top:30%;right:12%;animation-delay:.6s">✦</span>
  <span class="sparkle" style="top:65%;left:6%;animation-delay:1.1s">✦</span>
  <span class="sparkle" style="top:55%;right:8%;animation-delay:1.5s">✦</span>

  <header>
    <div class="ball" aria-hidden="true"></div>
    <!-- CHANGE ME: your name and tagline -->
    <h1>Your Name</h1>
    <p class="tagline">Stayin' online</p>
  </header>

  <main>
    <h2>Welcome to the party</h2>
    <!-- CHANGE ME: a few sentences about you -->
    <p>Grab your platform shoes. This is my little disco on the internet, where I share the things I build, the stuff I'm learning and whatever's got me dancing lately.</p>

    <h2>Hit the floor</h2>
    <!-- CHANGE ME: point these at your own pages -->
    <div class="links">
      <a href="#">Projects</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </div>
  </main>

  <div class="floor" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <footer>★ DANCE LIKE NOBODY'S WATCHING ★</footer>
</body>
</html>
